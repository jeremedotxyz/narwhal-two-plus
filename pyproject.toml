[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narwhal-two-plus"
version = "0.1.0"
description = "Reference simulation and data tools for a concept 532 nm underwater LiDAR"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
narwhal = "narwhal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
